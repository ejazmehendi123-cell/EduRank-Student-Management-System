services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-student_db}
      POSTGRES_USER: ${DB_USER:-sms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sms_secure_password_2026}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_sms_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sms_user} -d ${DB_NAME:-student_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - sms_network

  # ----------------------------------------------------------------------------
  # 2. Spring Boot 3.3.5 Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sms_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-student_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-sms_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-sms_secure_password_2026}
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:-TEACHER_SECURE_KEY_2026}
    ports:
      - "8081:8081"
    networks:
      - sms_network

  # ----------------------------------------------------------------------------
  # 3. React Native Web Client (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"
    networks:
      - sms_network

  # ----------------------------------------------------------------------------
  # 4. Ready Link Banner (Prints access URLs in terminal)
  # ----------------------------------------------------------------------------
  welcome-banner:
    image: alpine:latest
    container_name: sms_banner
    restart: "no"
    depends_on:
      - frontend
      - backend
    command: >
      sh -c "echo '' &&
             echo '================================================================================' &&
             echo '  🎓 STUDENT MANAGEMENT SYSTEM READY!' &&
             echo '================================================================================' &&
             echo '  👉 Web Application:     http://localhost:8082' &&
             echo '  👉 REST API Backend:    http://localhost:8081/api/v1' &&
             echo '  👉 Database (Postgres): localhost:5434' &&
             echo '' &&
             echo '  Demo Accounts:' &&
             echo '    Teacher: teacher@sms.edu | Password: Password123!' &&
             echo '    Student: alice@sms.edu   | Password: Password123!' &&
             echo '================================================================================' &&
             echo ''"
    networks:
      - sms_network

volumes:
  postgres_sms_data:
    name: postgres_sms_data

networks:
  sms_network:
    name: sms_network
    driver: bridge
